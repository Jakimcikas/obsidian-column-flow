# Push a tag matching manifest.json's version (e.g. `git tag 0.1.2 && git push origin 0.1.2`)
# to build the plugin, attest the files' provenance, and publish the GitHub release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css
          --title "$GITHUB_REF_NAME"
          --notes-file "release-notes/$GITHUB_REF_NAME.md"
